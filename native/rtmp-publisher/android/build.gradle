buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'vn.livestudio.rtmp'
    compileSdk 35

    defaultConfig {
        minSdk 23
    }
}

// Loại bỏ hoàn toàn khối repositories phụ thuộc mạng ngoài nếu không cần thiết
repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')

    // Trỏ trực tiếp tới các file .aar đặt trong thư mục libs cục bộ
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
